<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TenderRadar</title>
<meta name="description" content="TenderRadar is being updated and will be back shortly.">
<meta name="robots" content="noindex">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="icon" href="assets/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="theme-color" content="#07090d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f4f5f8; --surface: #ffffff; --border: rgba(15, 20, 35, .08);
  --text: #0d1220; --text-2: #4b5565; --text-3: #8a93a3;
  --grad: linear-gradient(135deg, #6d5cf6 0%, #4f5bd5 45%, #1d8fe0 100%);
  --glow: rgba(110, 100, 255, .10);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #07090d; --surface: #0e1118; --border: rgba(255, 255, 255, .07);
    --text: #eef1f6; --text-2: #9aa3b2; --text-3: #646d7d;
    --grad: linear-gradient(135deg, #8b7bff 0%, #6c8cff 45%, #4fb8ff 100%);
    --glow: rgba(110, 120, 255, .16);
  }
}
:root[data-theme="dark"] {
  --bg: #07090d; --surface: #0e1118; --border: rgba(255, 255, 255, .07);
  --text: #eef1f6; --text-2: #9aa3b2; --text-3: #646d7d;
  --grad: linear-gradient(135deg, #8b7bff 0%, #6c8cff 45%, #4fb8ff 100%);
  --glow: rgba(110, 120, 255, .16);
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 32px 16px; background: var(--bg); color: var(--text);
  background-image: radial-gradient(600px 360px at 50% 30%, var(--glow), transparent 70%);
  font: 15px/1.6 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased; letter-spacing: -.006em;
}
.card {
  width: 100%; max-width: 460px; text-align: center; padding: 40px 28px;
  background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
  box-shadow: 0 24px 48px -28px rgba(0, 0, 0, .35);
}
.brand { display: inline-flex; align-items: center; gap: 10px; font-weight: 650; font-size: 15px; letter-spacing: -.02em; color: var(--text-2); }
.brand img { border-radius: 7px; }
h1 {
  margin: 28px 0 10px; font-size: 30px; line-height: 1.2; font-weight: 700; letter-spacing: -.03em;
  background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
}
p { margin: 0; color: var(--text-2); }
.pulse { display: inline-flex; align-items: center; gap: 8px; margin-top: 26px; font-size: 13px; color: var(--text-3); }
.pulse i { width: 8px; height: 8px; border-radius: 50%; background: #4f8cff; animation: p 1.6s ease-in-out infinite; }
@keyframes p { 0%, 100% { opacity: .35; transform: scale(.85); } 50% { opacity: 1; transform: scale(1); } }
@media (prefers-reduced-motion: reduce) { .pulse i { animation: none; } }
footer { margin-top: 28px; font-size: 12.5px; color: var(--text-3); text-align: center; }
</style>
</head>
<body>
  <main class="card">
    <div class="brand"><img src="assets/logo-mark.svg" alt="" width="28" height="28"><span>TenderRadar</span></div>
    <h1>We'll be right back</h1>
    <p>TenderRadar is being upgraded with new tender sources. Your tracking notes and shortlists are saved in your browser and will be here when we return.</p>
    <div class="pulse"><i></i>Back shortly</div>
  </main>
  <footer>Designed and built by Bireshwar Chakravarty · © 2026 Bireshwar Chakravarty. All rights reserved.</footer>
</body>
</html>
