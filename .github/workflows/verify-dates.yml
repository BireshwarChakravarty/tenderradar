name: Audit published tenders

# Independent daily check: re-opens every tender the website shows and
# compares its closing date with the source page. Nothing is committed. The
# run fails, and GitHub emails the owner, if any published date is wrong.
on:
  schedule:
    - cron: '17 22 * * *'      # 03:47 IST, between scrape runs
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - name: Use the latest stored data
        run: |
          git fetch --depth=1 origin main
          git checkout origin/main -- docs/data/
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          pip install -r scraper/requirements.txt
          playwright install chromium --with-deps
      - name: Audit published closing dates
        run: python scraper/verify_dates.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: verify-dates
          path: verify_dates.json
          if-no-files-found: ignore
