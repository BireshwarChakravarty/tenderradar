name: Audit published tenders

# Independent daily check: re-checks every tender the website shows against
# the publish rules, and re-reads a sample of the source with a second
# parser. Nothing is committed. The run fails, and GitHub emails the owner,
# if anything is wrong.
on:
  # ON HOLD since 24 Oct 2026: schedule removed so nothing runs automatically.
  # To resume, restore:
  #   schedule:
  #   - cron: '17 22 * * *'      # 03:47 IST, between scrape runs
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - name: Use the latest stored data
        run: |
          git fetch --depth=1 origin main
          git checkout origin/main -- docs/data/
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r scraper/requirements.txt
      - name: Audit published closing dates
        env:
          # TEMPORARY: matches scrape.yml while the last TenderDetail tenders
          # are still shown. Remove with the line in scrape.yml.
          MAX_VERIFY_AGE_HOURS: '96'
        run: python scraper/verify_dates.py
