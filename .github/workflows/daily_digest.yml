name: TenderRadar Daily Digest

on:
  schedule:
    - cron: '30 2 * * *'       # 8:00 AM IST
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install python-dotenv

      - name: Send daily digest
        env:
          DASHBOARD_URL:       https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          MIN_RELEVANCE_SCORE: ${{ secrets.MIN_RELEVANCE_SCORE || '6.0' }}
          SMTP_USER:           ${{ secrets.SMTP_USER }}
          SMTP_PASS:           ${{ secrets.SMTP_PASS }}
          ALERT_EMAIL_TO:      ${{ secrets.ALERT_EMAIL_TO }}
          TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scraper/daily_digest.py
