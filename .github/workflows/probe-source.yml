name: Probe alternative source (temporary)

# Read-only experiment from the development branch; commits nothing.
on:
  push:
    branches: [claude/zen-edison-2nzih6]
    paths: [probe/**, .github/workflows/probe-source.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install playwright && playwright install chromium --with-deps
      - run: python probe/official_probe.py
