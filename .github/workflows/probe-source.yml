name: Probe alternative source (temporary)

# Read-only experiment from the development branch; commits nothing.
on:
  push:
    branches: [claude/zen-edison-2nzih6]
    paths: [probe/**, scraper/cppp.py, .github/workflows/probe-source.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install -r scraper/requirements.txt
      - run: python probe/cppp_probe.py
