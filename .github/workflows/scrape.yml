name: TenderRadar Scraper

on:
  schedule:
    - cron: '0 */4 * * *'      # every 4 hours; every listing is re-read about once a day
  workflow_dispatch:
    inputs:
      mode:
        description: 'auto (default), or full to read as much of the source as time allows (first fill, up to 4 hours)'
        required: false
        default: 'auto'
        type: choice
        options: [auto, full]

permissions:
  contents: write

# Never run two scrapes at once: the second would overwrite the first's data
concurrency:
  group: tenderradar-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event.inputs.mode == 'full' && 260 || 110 }}
    env:
      DASHBOARD_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      MIN_RELEVANCE_SCORE: ${{ secrets.MIN_RELEVANCE_SCORE || '6.0' }}
      SCRAPE_MODE: ${{ github.event.inputs.mode || 'auto' }}
      # TEMPORARY (15 Oct 2026): keeps the last TenderDetail tenders visible
      # while CPPP data builds up; expired tenders are still never shown.
      # Remove this line to return to 36.
      MAX_VERIFY_AGE_HOURS: '96'

    steps:
      - uses: actions/checkout@v7
        with:
          # A run queued behind another must start from the data that run
          # pushed, not from the commit it was triggered on
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Run tests
        run: python -m unittest discover -s scraper/tests -t scraper

      - name: Scrape, filter and score
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COMPANY_PROFILE:   ${{ secrets.COMPANY_PROFILE }}
          COMPANY_KNOWLEDGE: ${{ secrets.COMPANY_KNOWLEDGE }}
        run: python scraper/main.py

      - name: Send alerts
        # Still alert on anything scored, even if the crawl itself failed
        if: always()
        env:
          SMTP_USER:          ${{ secrets.SMTP_USER }}
          SMTP_PASS:          ${{ secrets.SMTP_PASS }}
          ALERT_EMAIL_TO:     ${{ secrets.ALERT_EMAIL_TO }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scraper/alerts.py

      - name: Commit updated data
        if: always()
        run: |
          git config user.name  "TenderRadar Bot"
          git config user.email "tenderradar-bot@users.noreply.github.com"
          git add docs/data/ data/
          git diff --staged --quiet && exit 0
          git commit -m "chore: update tenders [$(date -u '+%Y-%m-%d %H:%M') UTC] [skip ci]"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push
