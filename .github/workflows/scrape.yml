name: TenderRadar Scraper

on:
  schedule:
    - cron: '0 */4 * * *'      # every 4 hours
  workflow_dispatch: {}

permissions:
  contents: write

# Never run two scrapes at once: the second would overwrite the first's data
concurrency:
  group: tenderradar-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DASHBOARD_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      MIN_RELEVANCE_SCORE: ${{ secrets.MIN_RELEVANCE_SCORE || '6.0' }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r scraper/requirements.txt
          playwright install chromium --with-deps

      - name: Run tests
        run: python -m unittest discover -s scraper/tests -t scraper

      - name: Scrape, filter and score
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COMPANY_PROFILE:   ${{ secrets.COMPANY_PROFILE }}
        run: python scraper/main.py

      - name: Send alerts
        # Still alert on anything scored, even if the crawl itself failed
        if: always()
        env:
          SMTP_USER:          ${{ secrets.SMTP_USER }}
          SMTP_PASS:          ${{ secrets.SMTP_PASS }}
          ALERT_EMAIL_TO:     ${{ secrets.ALERT_EMAIL_TO }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scraper/alerts.py

      - name: Commit updated data
        if: always()
        run: |
          git config user.name  "TenderRadar Bot"
          git config user.email "tenderradar-bot@users.noreply.github.com"
          git add docs/data/
          git diff --staged --quiet && exit 0
          git commit -m "chore: update tenders [$(date -u '+%Y-%m-%d %H:%M') UTC] [skip ci]"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push
